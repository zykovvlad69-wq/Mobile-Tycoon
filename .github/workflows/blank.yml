name: Сборка Mobile Tycoon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3.0

    steps:
      - name: Получить проект
        uses: actions/checkout@v4

      - name: Собрать APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/MobileTycoon.apk

      - name: Скачать APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Tycoon-APK
          path: build/MobileTycoon.apk
